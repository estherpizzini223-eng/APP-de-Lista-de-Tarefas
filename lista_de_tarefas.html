<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do App</title>
    <link rel="stylesheet" href="lista_estilo.css">
</head>
<body>
    <div class="container">
        <div class="stats-container">
            <div class="details">
                <h1>Aplicativo de Tarefas</h1>
                <p>Continue Assim!</p>
                <div id="progressBar">
                    <div id="progress"></div>
                </div>
            </div>
            <div class="stats-numbers">
                <p id="numbers">0 / 0</p>
            </div>
        </div>

        <form action="">
        <input type="text" id="taskInput" placeholder="Escreva sua tarefa">
        <button id="newTask" type="submit">+</button>
    </form>

    <ul id="task-list"></ul>
    </div>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.5.3/tsparticles.confetti.bundle.min.js"></script>
</body>
</html>
